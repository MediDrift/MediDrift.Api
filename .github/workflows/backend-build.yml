name: Backend build

on:
  push:
    branches:
      - master
      - feature/full-catalogue-audit-source-export
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MediDrift.Api.csproj

      - name: Build
        run: dotnet build MediDrift.Api.csproj --configuration Release --no-restore
